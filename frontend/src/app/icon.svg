<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="WatchWhat">
  <!-- Palette du thème « salle obscure » :
       velours #dc4636 (accent), encre #f2f2f3, rampe graphite #0d0d0e → #2a2a2d -->

  <!-- film cassette body -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#0d0d0e"/>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="none" stroke="#2a2a2d" stroke-width="3"/>

  <!-- film sprocket holes -->
  <g fill="#232325">
    <rect x="22" y="40" width="14" height="20" rx="4"/>
    <rect x="22" y="78" width="14" height="20" rx="4"/>
    <rect x="22" y="116" width="14" height="20" rx="4"/>
    <rect x="22" y="154" width="14" height="20" rx="4"/>
    <rect x="22" y="192" width="14" height="20" rx="4"/>
    <rect x="220" y="40" width="14" height="20" rx="4"/>
    <rect x="220" y="78" width="14" height="20" rx="4"/>
    <rect x="220" y="116" width="14" height="20" rx="4"/>
    <rect x="220" y="154" width="14" height="20" rx="4"/>
    <rect x="220" y="192" width="14" height="20" rx="4"/>
  </g>

  <!-- film frame window -->
  <rect x="46" y="52" width="164" height="152" rx="14" fill="#141416"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- first W (velvet) -->
    <path d="M62 80 L82 176 L102 112 L122 176 L142 80" stroke="#dc4636" stroke-width="13"/>
    <!-- second W (ink) slides into the first; dark casing separates them -->
    <path d="M114 80 L134 176 L154 112 L174 176 L194 80" stroke="#141416" stroke-width="21"/>
    <path d="M114 80 L134 176 L154 112 L174 176 L194 80" stroke="#f2f2f3" stroke-width="13"/>
    <!-- weave: velvet passes back over ink at the second crossing -->
    <path d="M128 150 L142 80" stroke="#141416" stroke-width="21"/>
    <path d="M128 150 L142 80" stroke="#dc4636" stroke-width="13"/>
  </g>
</svg>
